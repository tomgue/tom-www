name: Hugo Build & Deploy Check

permissions:
  contents: read

on:
  push:
    branches: ['dev', 'main']
  pull_request:
    branches: ['main']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Read versions from netlify.toml (single source of truth)
        id: versions
        run: |
          echo "hugo=$(grep -oP 'HUGO_VERSION = "\K[^"]+' netlify.toml)" >> "$GITHUB_OUTPUT"
          echo "node=$(grep -oP 'NODE_VERSION = "\K[^"]+' netlify.toml)" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.versions.outputs.node }}
          cache: 'yarn'
          cache-dependency-path: '**/yarn.lock'

      - name: Install Node.js dependencies
        run: yarn install --frozen-lockfile

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ steps.versions.outputs.hugo }}
          extended: true

      - name: Install Hugo modules
        run: yarn install:hugolify

      - name: Build with Pagefind
        env:
          HUGO_ENVIRONMENT: production
        run: yarn build:search

      - name: Verify public folder
        run: |
          if [ ! -d "public" ]; then
            echo "Build failed: public folder not generated"
            exit 1
          fi
