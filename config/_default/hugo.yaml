## LANGUAGE
defaultContentLanguage: fr
enableEmoji: true
enableRobotsTXT: true

## ADVANCED
build:
  buildStats:
    disableClasses: false
    disableIDs: true
    disableTags: false
    enable: true

pagination:
  pagerSize: 9
removePathAccents: true

markup:
  tableOfContents:
    ordered: true
  goldmark:
    renderer:
      hardWraps: true
    extensions:
      extras:
        delete:
          enable: true
        insert:
          enable: true
        mark:
          enable: true
        subscript:
          enable: true
        superscript:
          enable: true
      strikethrough: false

caches:
  images:
    dir: :cacheDir/images
