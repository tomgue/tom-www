_merge: deep

# Umami Analytics Configuration
analytics:
  umami:
    website_id: '0fe3507c-451a-4694-9684-be54bfd4b8cd'
    domains: 'gueroult.me'

form:
  netlify: true

icons:
  strokeWidth: 1.5

# logo:
#   header: '/assets/images/logo.svg'
#   footer: '/assets/images/logo-footer.svg' # default: /assets/images/logo.svg

css:
  darkmode: true
  preload: true
  print: true
  postcss: 'postcss/design-system'

# Search
search:
  enable: true # Set true to enable search
  layout: drawer # Also raw, modal or drawer
  filter: false # Set true to add filters by type
  sort: false # Set true to add sort by date

image:
  retina:
    desktop: true

docs:
  thumbnail:
    desktop: '38x38'
    desktop_large: '100x100'
    mobile: '38x38'
    scrollsnap: '38x38'

# Admin
admin:
  cms: sveltiacms
  name: github
  repo: tomgue/tom-www
  branch: dev
  title: TomLab CMS
  preview: true
  skip_ci: false
  # publish_mode: preview

  fields:
    body:
      minimal: false
      modes: "['rich_text', 'raw']"
    text_markdown:
      minimal: false
      modes: "['rich_text', 'raw']"

  slug:
    encoding: unicode
    clean_accents: true
    sanitize_replacement: '-'
    trim: true
    lowercase: true

  media_libraries:
    all:
      slugify_filename: true
      filename_template: '{{slug}}-{{filename}}-{{uuid_short}}'

  netlify:
    identity: true

  collections:
    indexes:
      enable: false

    persons:
      view_groups:
        - label: 'Draft'
          field: draft
      media_folder: /assets/images/uploads/persons
      public_folder: /images/uploads/persons
      summary_fields:
        - summary
        - draft
        - firstname
        - lastname
        - persons_places
        - field: contact.email
          label: Email

    posts:
      view_filters:
        - label: 'Posts published in 2026'
          field: date
          pattern: '2026'
        - label: 'Drafts'
          field: draft
          pattern: true
      sortable_fields:
        - field: date
          default_sort: desc
        - title
        - commit_date
      view_groups:
        - label: 'Draft'
          field: draft
      media_folder: /assets/images/uploads/posts
      public_folder: /images/uploads/posts
      summary: "**{{title}}** - {{draft | ternary('⛔️ Brouillon', '✅ _Publié_')}}"

    places:
      reorder: true
      view_groups:
        - label: 'Draft'
          field: draft
      media_folder: /assets/images/uploads/places
      public_folder: /images/uploads/places
      summary: "**{{title}}** - {{draft | ternary('⛔️ Brouillon', '✅ _Publié_')}}"

    pages:
      view_groups:
        - label: 'Draft'
          field: draft
      thumbnail: image.src
      media_folder: /assets/images/uploads/pages
      public_folder: /images/uploads/pages
      summary: "**{{title}}** - {{draft | ternary('⛔️ Brouillon', '✅ _Publié_')}}"

    docs:
      reorder: true
      media_folder: /assets/images/uploads/docs
      public_folder: /images/uploads/docs
      thumbnail: image.src
      summary_fields:
        - title
        - draft
      view_groups:
        - label: 'Draft'
          field: draft
      fields:
        - id
        - is_not_index
        - draft
        - title_page
        - description
        - icon
        - featured_image
        - body
        - slug
      summary: "**{{title}}** - {{draft | ternary('⛔️ Brouillon', '✅ _Publié_')}}"
      nested:
        depth: 10
        subfolders: true
